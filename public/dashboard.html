<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TechStore - Dashboard</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<header class="navbar">

    <div class="nav-brand">

        <div class="logo-small">
            T
        </div>

        <span>
            TechStore
        </span>

    </div>

    <div class="user-area">

        <span id="userName">
            Usuario
        </span>

        <span
            id="userRole"
            class="role"
        >
            ROL
        </span>

        <button
            id="logout"
            class="logout"
        >
            Cerrar sesión
        </button>

    </div>

</header>

<main class="dashboard">

    <section class="welcome">

        <h1>
            Dashboard
        </h1>

        <p id="welcomeText">
            Bienvenido al sistema.
        </p>

    </section>

    <section class="stats">

        <div class="stat-card">

            <span class="stat-icon">
                📦
            </span>

            <div>

                <p>Productos</p>

                <h2 id="totalProducts">
                    0
                </h2>

            </div>

        </div>

        <div class="stat-card">

            <span class="stat-icon">
                🏪
            </span>

            <div>

                <p>Tienda</p>

                <h2 id="storeName">
                    -
                </h2>

            </div>

        </div>

        <div class="stat-card">

            <span class="stat-icon">
                👤
            </span>

            <div>

                <p>Rol</p>

                <h2 id="roleName">
                    -
                </h2>

            </div>

        </div>

    </section>

    <section class="products-section">

        <div class="section-header">

            <div>

                <h2>
                    Inventario
                </h2>

                <p>
                    Gestión de productos
                </p>

            </div>

            <button
                id="newProductButton"
                class="btn-primary small-btn"
            >
                + Nuevo producto
            </button>

        </div>

        <div
            id="productFormContainer"
            class="product-form hidden"
        >

            <h3>
                Registrar producto
            </h3>

            <form id="productForm">

                <input
                    id="productName"
                    placeholder="Nombre"
                    required
                >

                <input
                    id="productSku"
                    placeholder="SKU"
                    required
                >

                <input
                    id="productCategory"
                    placeholder="Categoria"
                    required
                >

                <input
                    id="productPrice"
                    type="number"
                    step="0.01"
                    placeholder="Precio"
                    required
                >

                <input
                    id="productStock"
                    type="number"
                    placeholder="Stock"
                    required
                >

                <button
                    class="btn-primary"
                    type="submit"
                >
                    Guardar
                </button>

            </form>

            <div id="productMessage"></div>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Producto</th>

                        <th>SKU</th>

                        <th>Categoría</th>

                        <th>Precio</th>

                        <th>Stock</th>

                        <th>Tienda</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="productsTable">

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="js/dashboard.js"></script>

</body>

</html>
